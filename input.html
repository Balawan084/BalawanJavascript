<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input JavaScript</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    overflow:hidden;
    color:white;
    position:relative;
}

/* BACKGROUND EFFECT */
body::before{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    background:#3b82f6;
    border-radius:50%;
    filter:blur(150px);
    opacity:0.25;
    top:-100px;
    left:-100px;
}

body::after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    background:#8b5cf6;
    border-radius:50%;
    filter:blur(150px);
    opacity:0.2;
    bottom:-100px;
    right:-100px;
}

/* CARD */
.container{
    width:90%;
    max-width:450px;
    padding:35px;
    border-radius:28px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(18px);
    box-shadow:0 10px 40px rgba(0,0,0,0.6);
    position:relative;
    z-index:2;
    text-align:center;
    animation:muncul 1s ease;
}

/* TITLE */
h2{
    font-size:32px;
    margin-bottom:10px;
}

.sub{
    opacity:0.7;
    margin-bottom:25px;
}

/* INPUT */
input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    outline:none;
    margin-bottom:15px;
    background:rgba(255,255,255,0.08);
    color:white;
    font-size:15px;
}

input::placeholder{
    color:#cbd5e1;
}

/* BUTTON */
button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    font-weight:600;
    font-size:15px;
    transition:0.3s;
    color:white;
    background:linear-gradient(135deg,#3b82f6,#2563eb);
}

button:hover{
    transform:translateY(-4px) scale(1.02);
    box-shadow:0 10px 25px rgba(59,130,246,0.5);
}

/* OUTPUT */
.hasil{
    margin-top:25px;
    padding:20px;
    border-radius:18px;
    background:rgba(255,255,255,0.06);
    min-height:100px;
    text-align:left;
    line-height:1.8;
    transition:0.3s;
}

/* BACK */
.back{
    margin-top:25px;
}

.back a{
    color:#93c5fd;
    text-decoration:none;
    transition:0.3s;
}

.back a:hover{
    color:white;
}

/* ANIMATION */
@keyframes muncul{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">

    <h2>⌨️ Input </h2>
    <p class="sub">Form input dengan alert & confirm</p>

    <input type="text" id="nama" placeholder="Masukkan nama...">

    <input type="number" id="umur" placeholder="Masukkan umur...">

    <button onclick="proses()">
        🚀 Proses Data
    </button>

    <div class="hasil" id="hasil">
        Hasil akan tampil di sini...
    </div>

    <div class="back">
        <a href="index.html">⬅ Kembali ke Menu</a>
    </div>

</div>

<script>

function proses(){

    var nama =
    document.getElementById("nama").value;

    var umur =
    document.getElementById("umur").value;

    if(nama=="" || umur==""){

        alert("⚠ Semua data harus diisi!");

        return;
    }

    var yakin = confirm(
        "Apakah data sudah benar?"
    );

    if(yakin){

        var status="";

        if(umur >= 18){

            status = "Dewasa";

        }else{

            status = "Belum Dewasa";
        }

        document.getElementById("hasil").innerHTML =

        `
        👤 Nama : ${nama}<br>
        🎂 Umur : ${umur} Tahun<br>
        📌 Status : ${status}
        `;

        alert("✅ Data berhasil diproses!");

    }else{

        alert("❌ Proses dibatalkan!");
    }
}

</script>

</body>
</html>
