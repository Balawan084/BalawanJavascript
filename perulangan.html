<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perulangan JavaScript</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#020617,#0f172a,#1e293b);
    color:white;
    position:relative;
}

/* BACKGROUND EFFECT */
body::before{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    background:#22c55e;
    border-radius:50%;
    filter:blur(150px);
    opacity:0.25;
    top:-100px;
    left:-100px;
}

body::after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    background:#3b82f6;
    border-radius:50%;
    filter:blur(150px);
    opacity:0.2;
    bottom:-100px;
    right:-100px;
}

/* CARD */
.container{
    width:90%;
    max-width:650px;
    padding:35px;
    border-radius:30px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(18px);
    box-shadow:0 10px 40px rgba(0,0,0,0.6);
    position:relative;
    z-index:2;
    text-align:center;
    animation:muncul 1s ease;
}

/* TITLE */
h2{
    font-size:32px;
    margin-bottom:10px;
}

.sub{
    opacity:0.7;
    margin-bottom:30px;
}

/* BUTTON AREA */
.menu{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

/* BUTTON */
button{
    padding:15px;
    border:none;
    border-radius:18px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
    color:white;
    transition:0.3s;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    box-shadow:0 5px 20px rgba(34,197,94,0.4);
}

button:hover{
    transform:translateY(-5px) scale(1.04);
    box-shadow:0 10px 30px rgba(34,197,94,0.6);
}

/* OUTPUT */
.output{
    margin-top:30px;
    padding:25px;
    border-radius:20px;
    min-height:180px;
    background:rgba(255,255,255,0.06);
    overflow:auto;
    text-align:left;
    font-size:17px;
    line-height:1.8;
    transition:0.3s;
}

/* BACK */
.back{
    margin-top:25px;
}

.back a{
    text-decoration:none;
    color:#93c5fd;
    transition:0.3s;
}

.back a:hover{
    color:white;
}

/* ANIMATION */
@keyframes muncul{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">

    <h2>🔁 Perulangan </h2>
    <p class="sub">Contoh penggunaan looping dengan tampilan modern</p>

    <div class="menu">
        <button onclick="angka()">🔢 Angka 1-10</button>
        <button onclick="bintang()">⭐ Pola Bintang</button>
        <button onclick="genap()">🟢 Bilangan Genap</button>
        <button onclick="mundur()">⬇ Hitung Mundur</button>
    </div>

    <div class="output" id="hasil">
        Pilih menu untuk menampilkan hasil perulangan...
    </div>

    <div class="back">
        <a href="index.html">⬅ Kembali ke Menu</a>
    </div>

</div>

<script>
function angka(){

    var hasil = "";

    for(var i=1; i<=10; i++){
        hasil += "Angka ke-" + i + "<br>";
    }

    document.getElementById("hasil").innerHTML = hasil;
}

function bintang(){

    var hasil = "";

    for(var i=1; i<=7; i++){

        for(var j=1; j<=i; j++){
            hasil += "⭐";
        }

        hasil += "<br>";
    }

    document.getElementById("hasil").innerHTML = hasil;
}

function genap(){

    var hasil = "";

    for(var i=2; i<=20; i+=2){
        hasil += "Bilangan Genap: " + i + "<br>";
    }

    document.getElementById("hasil").innerHTML = hasil;
}

function mundur(){

    var hasil = "";

    for(var i=10; i>=1; i--){
        hasil += "Countdown: " + i + "<br>";
    }

    hasil += "<br>🚀 GO!";

    document.getElementById("hasil").innerHTML = hasil;
}
</script>

</body>
</html>
