<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu JavaScript</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg1:#0f172a;
    --bg2:#1e293b;
    --card:rgba(255,255,255,0.05);
    --text:#e2e8f0;
    --accent:#3b82f6;
}

/* LIGHT MODE */
.light{
    --bg1:#f1f5f9;
    --bg2:#e2e8f0;
    --card:#ffffff;
    --text:#0f172a;
    --accent:#6366f1;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background: linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--text);
    transition:0.4s;
    overflow-x:hidden;
}

.wrapper{
    width:100%;
    max-width:1100px;
    padding:30px 20px;
}

/* ===== LOGO SUPER EFFECT ===== */
.logo{
    text-align:center;
    margin-bottom:25px;
    position:relative;
}

/* GLOW BELAKANG */
.logo::before{
    content:"";
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:160px;
    height:160px;
    border-radius:50%;
    background: radial-gradient(circle, #3b82f6, transparent 70%);
    filter: blur(25px);
    opacity:0.6;
    animation: pulse 3s infinite;
    z-index:0;
}

.logo img{
    width:120px;
    position:relative;
    z-index:1;

    filter: brightness(1.2) contrast(1.2)
            drop-shadow(0 0 15px #3b82f6)
            drop-shadow(0 0 30px #22d3ee);

    animation: float 4s ease-in-out infinite;
    transition:0.4s;
}

.logo img:hover{
    transform: scale(1.15) rotate(5deg);
}

/* ANIMASI */
@keyframes float{
    0%{ transform: translateY(0); }
    50%{ transform: translateY(-12px); }
    100%{ transform: translateY(0); }
}

@keyframes pulse{
    0%{
        transform:translate(-50%,-50%) scale(1);
        opacity:0.5;
    }
    100%{
        transform:translate(-50%,-50%) scale(1.3);
        opacity:0.2;
    }
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:30px;
}

h1{
    font-size:24px;
}

.toggle{
    padding:8px 15px;
    border:none;
    border-radius:999px;
    cursor:pointer;
    background:var(--accent);
    color:white;
    transition:0.3s;
}

.toggle:hover{
    transform:scale(1.05);
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

/* CARD */
.card{
    background:var(--card);
    backdrop-filter: blur(15px);
    padding:25px;
    border-radius:18px;
    text-align:center;
    text-decoration:none;
    color:var(--text);
    transition:0.3s;
    position:relative;
    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.15),
        transparent
    );
    top:-50%;
    left:-50%;
    transform:rotate(25deg);
    transition:0.5s;
    opacity:0;
}

.card:hover::before{
    opacity:1;
}

.card:hover{
    transform:translateY(-8px) scale(1.05);
    box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

/* ICON */
.icon{
    font-size:30px;
    margin-bottom:10px;
    transition:0.3s;
}

.card:hover .icon{
    transform:scale(1.2) rotate(5deg);
}

.card h3{
    margin-bottom:8px;
}

.card p{
    font-size:13px;
    opacity:0.8;
}

/* ===== CREATOR ===== */
.creator{
    margin-top:40px;
    text-align:center;
    padding:20px;
    border-radius:15px;
    background:var(--card);
    backdrop-filter: blur(10px);
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.creator p{
    font-size:12px;
    opacity:0.7;
    margin-bottom:5px;
}

.creator h3{
    font-size:20px;
}

/* ===== SOSMED ===== */
.sosmed{
    margin-top:8px;
    display:flex;
    justify-content:center;
    gap:14px;
}

.sosmed img{
    width:20px;
    opacity:0.5;
    transition:0.3s;
}

/* INSTAGRAM */
.sosmed a:nth-child(1) img:hover{
    opacity:1;
    transform:scale(1.25) rotate(10deg);
    filter: drop-shadow(0 0 6px #e1306c);
}

/* WHATSAPP */
.sosmed a:nth-child(2) img:hover{
    opacity:1;
    transform:scale(1.25) rotate(-10deg);
    filter: drop-shadow(0 0 6px #25d366);
}

/* RESPONSIVE */
@media (max-width:500px){

    h1{
        font-size:18px;
    }

}
</style>

<script>
function toggleTheme(){
    document.body.classList.toggle("light");
}
</script>
